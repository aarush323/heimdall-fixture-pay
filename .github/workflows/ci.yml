name: CI

on:
  push:
    branches: ["heimdall-test/demo-base"]
  pull_request:
    branches: ["heimdall-test/demo-base"]

permissions:
  contents: read

jobs:
  test:
    name: go test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Product tests
        run: go test $(go list ./... | grep -v /tests/heimdall)
      - name: Heimdall acceptance tests
        run: |
          pkgs=$(go list ./tests/heimdall/... 2>/dev/null || true)
          if [ -n "$pkgs" ]; then go test $pkgs; else echo "No Heimdall tests on this commit"; fi
